# Configuration
theme:
    name: 'material'
    palette:
        - scheme: 'viva' # See extra.css
          primary: 'amber'
     #   accent: 'indigo'
        #   toggle:
        #     icon: material/lightbulb-outline
        #     name: Switch to dark mode
        # - scheme: slate
        #   primary: 'amber'
        #   toggle:
        #     icon: material/lightbulb
        #     name: Switch to light mode
    features:
      - tabs
      - navigation.tabs
      - navigation.indexes
      - navigation.top
      - navigation.tabs.sticky
      - toc.follow
      - content.code.copy
      - content.code.annotate
      
    icon: #'images/VIRTUAL.png'
        #logo: fontawesome/brands/git-alt
        logo: material/walk
        repo: fontawesome/brands/git-alt
        annotation: material/arrow-right-circle
        # Find more at https://material.io/resources/icons/
    # font:
    #     text: Heeba
    #     code: Roboto Mono
    favicon: 'images/favicon.ico'

# Extensions
markdown_extensions:
  - abbr
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.arithmatex
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.magiclink
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - toc:
      permalink: true

# Plugins
plugins:
  - search
  - bibtex:
      bib_file: "docs/viva-refs.bib"
#          - "viva-refs-1.bib"
      cite_style: "pandoc"
  - git-revision-date
  - mkdocs-video
  - blog:
      archive: false
  - rss:
      match_path: blog/posts/.* 
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
 
extra_javascript:
  - 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_CHTML'

extra_css:
  - css/extra.css
